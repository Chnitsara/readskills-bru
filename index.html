<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadSkills BRU – Buriram Rajabhat University</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Prompt & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Progress Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bruLavender: {
              100: '#EADBFC',
              200: '#D4C2E6',
              300: '#C4B1DB',
              600: '#654394',
              700: '#53347C',
              900: '#3C2A58',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

  <!-- Snowfall Background Canvas (Active on every page) -->
  <div id="snowfall" class="snowfall-bg"></div>

  <!-- Header / Navigation Bar (Hidden on Login screen, visible when logged in) -->
  <header id="app-header" class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-purple-200/60 shadow-sm hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Brand / Logo -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigate('dashboard')">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-700 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-purple-300">
            <i data-lucide="book-open-check" class="w-6 h-6"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-xl tracking-tight text-slate-900">ReadSkills <span class="text-purple-700">BRU</span></span>
            </div>
            <p class="text-xs text-slate-600">Buriram Rajabhat University | A1-B2 English</p>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
          <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Home / Dashboard</span>
          </button>
          
          <button onclick="app.navigate('lessons')" id="nav-lessons" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>Reading Lessons</span>
          </button>
          
          <button onclick="app.navigate('strategies')" id="nav-strategies" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="lightbulb" class="w-4 h-4"></i>
            <span>Reading Strategies</span>
          </button>
          
          <button onclick="app.navigate('practice')" id="nav-practice" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="tv" class="w-4 h-4"></i>
            <span>Practice & Quiz</span>
          </button>
          
          <button onclick="app.navigate('progress')" id="nav-progress" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            <span>Learning Progress</span>
          </button>

          <button onclick="app.navigate('admin')" id="nav-admin" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-amber-900 bg-amber-100/80 hover:bg-amber-100 border border-amber-300/60">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span>Teacher Report</span>
          </button>
        </nav>

        <!-- User Profile & Sign Out -->
        <div class="flex items-center space-x-3">
          <div class="hidden sm:flex flex-col items-end">
            <span id="user-display-name" class="text-sm font-semibold text-slate-900">Student User</span>
            <div class="flex items-center space-x-1 text-xs text-purple-800 font-medium">
              <i data-lucide="clock" class="w-3.5 h-3.5"></i>
              <span>Online: <strong id="live-timer-display">00:00:00</strong></span>
            </div>
          </div>

          <button onclick="app.logout()" class="px-3.5 py-2 rounded-xl bg-purple-100 hover:bg-purple-200 text-purple-900 text-xs font-semibold flex items-center space-x-1.5 transition border border-purple-200" title="Sign Out">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Sign Out</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 z-10">
    <!-- Rendered dynamically (Login Screen or Main Dashboard/Module Views) -->
  </main>

  <!-- Immediate Feedback Modal -->
  <div id="feedback-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-purple-100 relative">
      <div id="feedback-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Footer (Visible when logged in) -->
  <footer id="app-footer" class="bg-white/80 backdrop-blur-md border-t border-purple-200/60 py-5 mt-auto z-10 hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-700">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-purple-900">ReadSKILLS BRU</span>
        <span>|</span>
        <span>Buriram Rajabhat University</span>
      </div>
      <div>
        <span>Theme: Pastel Lavender & Soft Purple | English A1–B2 with Thai Support</span>
      </div>
      <div class="text-purple-800 font-semibold">
        Reading Skills Today A Brighter Tomorrow ♡
      </div>
    </div>
  </footer>

  <!-- App Data & Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
