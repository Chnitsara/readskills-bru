<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Skills – Buriram Rajabhat University</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Prompt & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Progress Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bruLavender: {
              100: '#EADBFC',
              200: '#D4C2E6',
              300: '#C4B1DB',
              600: '#654394',
              700: '#53347C',
              900: '#3C2A58',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

  <!-- Snowfall Background Canvas (Active on every page) -->
  <div id="snowfall" class="snowfall-bg"></div>

  <!-- Header / Navigation Bar (Hidden on Login screen, visible when logged in) -->
  <header id="app-header" class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-purple-200/60 shadow-sm hidden">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Brand / Logo -->
        <div class="flex items-center space-x-2.5 sm:space-x-3 cursor-pointer shrink-0" onclick="app.navigate('dashboard')">
          <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-purple-700 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-purple-300">
            <i data-lucide="book-open-check" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-base sm:text-xl tracking-tight text-slate-900">Reading <span class="text-purple-700">Skills</span></span>
            </div>
            <p class="hidden sm:block text-[11px] text-slate-600">Buriram Rajabhat University | A1-B2 English</p>
          </div>
        </div>

        <!-- Navigation Links (Desktop) -->
        <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
          <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Home / Dashboard</span>
          </button>
          
          <button onclick="app.navigate('lessons')" id="nav-lessons" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>Reading Lessons</span>
          </button>
          
          <button onclick="app.navigate('strategies')" id="nav-strategies" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="lightbulb" class="w-4 h-4"></i>
            <span>Reading Strategies</span>
          </button>
          
          <button onclick="app.navigate('practice')" id="nav-practice" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="tv" class="w-4 h-4"></i>
            <span>Practice & Quiz</span>
          </button>
          
          <button onclick="app.navigate('progress')" id="nav-progress" class="nav-btn px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 text-slate-700 hover:text-purple-800 hover:bg-white/60">
            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            <span>Learning Progress</span>
          </button>

        </nav>

        <!-- User Profile Dropdown Menu (Includes Sign Out) -->
        <div class="relative" id="user-profile-menu-container">
          <!-- Profile Trigger Pill (No border, single line name) -->
          <button 
            type="button" 
            onclick="app.toggleUserMenu(event)" 
            id="user-profile-btn" 
            class="flex items-center space-x-2 sm:space-x-3 px-1.5 sm:px-2 py-1.5 rounded-2xl hover:bg-purple-100/60 transition text-left cursor-pointer focus:outline-none group"
            title="User Profile & Menu"
          >
            <!-- User Avatar Circle -->
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-purple-700 via-purple-600 to-pink-500 text-white flex items-center justify-center font-bold text-xs sm:text-sm shadow-sm shadow-purple-300/60 shrink-0">
              <span id="user-avatar-initial">S</span>
            </div>

            <!-- User Name & Online Timer -->
            <div class="flex flex-col items-start leading-tight whitespace-nowrap">
              <span id="user-display-name" class="text-xs sm:text-sm font-bold text-slate-800 group-hover:text-purple-900 transition whitespace-nowrap max-w-[85px] sm:max-w-none truncate">Somsak Jaidee</span>
              <div class="flex items-center space-x-1 sm:space-x-1.5 text-[10px] sm:text-[11px] text-purple-700 font-medium mt-0.5 whitespace-nowrap">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                <span class="whitespace-nowrap"><strong id="live-timer-display" class="font-bold text-purple-900">00:00:00</strong></span>
              </div>
            </div>

            <!-- Dropdown Chevron Icon -->
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-purple-500 group-hover:text-purple-800 transition-transform duration-200 shrink-0" id="user-menu-chevron"></i>
          </button>

          <!-- Dropdown Menu -->
          <div id="user-dropdown-menu" class="hidden absolute right-0 mt-2.5 w-64 bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-purple-100 py-2 z-50 animate-in fade-in">
            <!-- User Info Header -->
            <div class="px-4 py-3 border-b border-purple-50 flex items-center space-x-3 bg-gradient-to-r from-purple-50/70 to-pink-50/40 rounded-t-xl">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-700 to-pink-500 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
                <span id="dropdown-avatar-initial">S</span>
              </div>
              <div class="overflow-hidden">
                <p id="dropdown-user-name" class="text-xs font-bold text-slate-900 truncate">Somsak Jaidee</p>
                <p id="dropdown-user-email" class="text-[11px] text-purple-700 truncate font-medium">student@bru.ac.th</p>
                <span class="inline-block mt-0.5 px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 text-[9px] font-semibold">Active Student</span>
              </div>
            </div>
            
            <div class="py-1.5 px-1.5 space-y-0.5">
              <!-- Teacher Report Dashboard Option -->
              <button 
                onclick="app.navigate('admin'); app.closeUserMenu();" 
                class="w-full text-left px-3 py-2.5 rounded-xl text-xs hover:bg-amber-50/90 text-slate-700 hover:text-amber-950 flex items-center space-x-3 transition group"
              >
                <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-900 group-hover:bg-amber-200 flex items-center justify-center shrink-0 border border-amber-200/80 transition">
                  <i data-lucide="shield-check" class="w-4 h-4"></i>
                </div>
                <div class="flex-1">
                  <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-900 group-hover:text-amber-900">Teacher Report</span>
                    <span class="text-[9px] bg-amber-100 text-amber-900 font-semibold px-1.5 py-0.5 rounded-md">Teacher</span>
                  </div>
                  <span class="text-[10px] text-slate-500">Student analytics & progress</span>
                </div>
              </button>

              <!-- Learning Progress Option -->
              <button 
                onclick="app.navigate('progress'); app.closeUserMenu();" 
                class="w-full text-left px-3 py-2 rounded-xl text-xs hover:bg-purple-50 text-slate-700 hover:text-purple-950 flex items-center space-x-3 transition group"
              >
                <div class="w-8 h-8 rounded-lg bg-purple-100 text-purple-800 group-hover:bg-purple-200 flex items-center justify-center shrink-0 transition">
                  <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                </div>
                <div>
                  <span class="font-semibold text-slate-800 group-hover:text-purple-900">Learning Progress</span>
                  <p class="text-[10px] text-slate-500">My study stats & charts</p>
                </div>
              </button>
            </div>

            <!-- Sign Out Option Inside Dropdown -->
            <div class="border-t border-purple-50 pt-1.5 mt-1 px-1.5">
              <button 
                onclick="app.logout(); app.closeUserMenu();" 
                class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50 flex items-center space-x-3 transition group cursor-pointer"
              >
                <div class="w-8 h-8 rounded-lg bg-rose-50 group-hover:bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 transition">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </div>
                <div>
                  <span class="block text-rose-600 font-bold">Sign Out (ออกจากระบบ)</span>
                  <span class="text-[10px] text-rose-400 font-normal">End current session</span>
                </div>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Container (Extra bottom padding for mobile nav bar) -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 pb-24 md:pb-8 z-10">
    <!-- Rendered dynamically (Login Screen or Main Dashboard/Module Views) -->
  </main>

  <!-- Immediate Feedback Modal -->
  <div id="feedback-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 items-center justify-center hidden p-3 sm:p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 sm:p-8 shadow-2xl border border-purple-100 relative max-h-[92vh] overflow-y-auto">
      <div id="feedback-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar (Visible only on mobile devices) -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-purple-200/80 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] px-1 py-1 flex justify-around items-center hidden">
    <button onclick="app.navigate('dashboard')" id="m-nav-dashboard" class="m-nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-[10px] font-semibold transition text-purple-900 cursor-pointer">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      </div>
      <span>Home</span>
    </button>
    
    <button onclick="app.navigate('lessons')" id="m-nav-lessons" class="m-nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-[10px] font-semibold transition text-slate-500 hover:text-purple-700 cursor-pointer">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center">
        <i data-lucide="book-open" class="w-4 h-4"></i>
      </div>
      <span>Lessons</span>
    </button>

    <button onclick="app.navigate('strategies')" id="m-nav-strategies" class="m-nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-[10px] font-semibold transition text-slate-500 hover:text-purple-700 cursor-pointer">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center">
        <i data-lucide="lightbulb" class="w-4 h-4"></i>
      </div>
      <span>Strategies</span>
    </button>

    <button onclick="app.navigate('practice')" id="m-nav-practice" class="m-nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-[10px] font-semibold transition text-slate-500 hover:text-purple-700 cursor-pointer">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center">
        <i data-lucide="tv" class="w-4 h-4"></i>
      </div>
      <span>Practice</span>
    </button>

    <button onclick="app.navigate('progress')" id="m-nav-progress" class="m-nav-btn flex flex-col items-center py-1 px-2.5 rounded-xl text-[10px] font-semibold transition text-slate-500 hover:text-purple-700 cursor-pointer">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center">
        <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
      </div>
      <span>Progress</span>
    </button>
  </nav>

  <!-- Footer (Visible when logged in) -->
  <footer id="app-footer" class="bg-white/80 backdrop-blur-md border-t border-purple-200/60 py-4 sm:py-5 mb-16 md:mb-0 mt-auto z-10 hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-slate-700 text-center sm:text-left">
      <div class="flex items-center justify-center sm:justify-start space-x-2">
        <span class="font-bold text-purple-900">Reading Skills</span>
        <span>|</span>
        <span>Buriram Rajabhat University</span>
      </div>
      <div class="text-purple-800 font-semibold text-[11px] sm:text-xs">
        Reading Skills Today A Brighter Tomorrow ♡
      </div>
    </div>
  </footer>

  <!-- App Data & Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
